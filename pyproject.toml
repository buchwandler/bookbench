[build-system]
requires = ["setuptools>=75", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bookbench"
dynamic = ["version"]
description = "Audiobook pipeline validation, comparison, and benchmarking harness for Buchwandler tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Buchwandler"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
bookbench = "bookbench.cli:main"

[tool.setuptools]
packages = ["bookbench"]

[tool.setuptools_scm]
fallback_version = "0.1.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
