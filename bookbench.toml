source = "fixtures/smoke.md"
language = "en-US"
title = "BookBench Smoke Test"
profiles_dir = "profiles"
work_root = ".bookbench/runs"
cache_dir = ".bookbench/cache/voicerender"
chapters = "all"
max_replans = 3
fail_fast = false

# Gate only engines with committed, validated RenderProfiles.
# Add another engine here after its profile has been created and validated.
required_engines = ["inflect", "kitten", "kokoro", "piper", "pocket", "supertonic"]

[speechscope]
backend = "redux"
device = "cpu"
normalization = "basic-v1"
# Exact spoken-content gate; SpeechScope allows only its bounded compound-boundary variants.
max_compound_wer = 0.0
max_cer = 0.0
# Optional strict whitespace-token boundary gate:
# max_wer = 0.0
# "renderplan" compares ASR with the exact text sent to synthesis.
# "source" compares ASR with the original source file and is only suitable when
# written and spoken forms are intentionally identical.
reference_mode = "renderplan"
